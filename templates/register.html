{% extends "base.html" %}
{% block content %}
<div class="auth-box">
  <h1>Create account</h1>
  <div class="panel">
    <form method="POST" action="{{ url_for('register') }}">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" maxlength="50"
             value="{{ form.get('name', '') }}" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email"
             value="{{ form.get('email', '') }}" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="8" maxlength="128" required>
      <p class="muted hint">At least 8 characters, with a letter and a number.</p>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" minlength="8" required>

      <button type="submit" class="full">Register</button>
    </form>
    <p class="muted switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
