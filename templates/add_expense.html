{% extends "base.html" %}
{% block content %}
<h1>{{ "Edit Transaction" if editing else "Add Transaction" }}</h1>

<div class="panel">
  <form method="POST" action="{{ url_for('edit_expense', expense_id=expense_id) if editing else url_for('add_expense') }}">

    <label>Type</label>
    <div class="radio-group">
      <label class="radio expense-radio">
        <input type="radio" name="type" value="expense" {{ "checked" if form.get('type', 'expense') == 'expense' }}> Expense
      </label>
      <label class="radio income-radio">
        <input type="radio" name="type" value="income" {{ "checked" if form.get('type') == 'income' }}> Income
      </label>
    </div>

    <label for="title">Title</label>
    <input type="text" id="title" name="title" maxlength="100"
           placeholder="e.g. Lunch at cafe" value="{{ form.get('title', '') }}" required>

    <label for="amount">Amount (₹)</label>
    <input type="number" id="amount" name="amount" step="0.01" min="0.01" max="10000000"
           value="{{ form.get('amount', '') }}" required>

    <label for="category">Category</label>
    <select id="category" name="category"></select>

    <label for="date">Date</label>
    <input type="date" id="date" name="date" max="{{ today }}"
           value="{{ form.get('date', today) }}" required>

    <label for="notes">Notes (optional)</label>
    <textarea id="notes" name="notes" rows="3" maxlength="300">{{ form.get('notes', '') }}</textarea>

    <div class="form-actions">
      <button type="submit">{{ "Update" if editing else "Save" }}</button>
      <a class="btn-link" href="{{ url_for('history') }}">Cancel</a>
    </div>
  </form>
</div>

<script>
  const CATEGORIES = {{ categories|tojson }};
  const selectedCategory = {{ form.get('category', '')|tojson }};
  const select = document.getElementById("category");

  function fillCategories() {
    const type = document.querySelector('input[name="type"]:checked').value;
    select.innerHTML = "";
    CATEGORIES[type].forEach(function (c) {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      if (c === selectedCategory) opt.selected = true;
      select.appendChild(opt);
    });
  }

  document.querySelectorAll('input[name="type"]').forEach(function (r) {
    r.addEventListener("change", fillCategories);
  });
  fillCategories();
</script>
{% endblock %}
